<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />


    <!-- ============================================================ -->
    <!-- PWA Install + Notification Banner — inline styles            -->
    <!-- ============================================================ -->
    <style>
      .install-banner {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 999;
        padding: 12px 16px;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
        background: var(--bg-elev);
        border-top: 1px solid var(--line);
        box-shadow: 0 -8px 32px rgba(0,0,0,0.18);
        animation: slideUp 0.3s ease;
      }
      @keyframes slideUp {
        from { transform: translateY(100%); }
        to   { transform: translateY(0); }
      }
      .install-banner-inner {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 620px;
        margin: 0 auto;
      }
      .install-banner-icon {
        width: 48px; height: 48px;
        border-radius: 12px;
        flex-shrink: 0;
      }
      .install-banner-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .install-banner-text strong {
        font-size: 14px;
        color: var(--text);
      }
      .install-banner-text span {
        font-size: 12px;
        color: var(--text-mute);
      }
      .install-dismiss {
        flex-shrink: 0;
        color: var(--text-mute);
      }

      /* ── Global: disable text-selection & image context menu ── */
      * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input, textarea, [contenteditable="true"], .allow-select {
        -webkit-user-select: text;
        user-select: text;
      }
      img, video {
        -webkit-user-drag: none;
        pointer-events: auto;
      }

      /* ── PWA Update banner ──────────────────────────────────── */
      .update-banner {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        padding-top: calc(12px + env(safe-area-inset-top));
        background: linear-gradient(135deg, #7c5cfc, #b45cf4);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 4px 24px rgba(124, 92, 252, 0.45);
        animation: slideDown 0.35s cubic-bezier(.32,1,.32,1);
      }
      @keyframes slideDown {
        from { transform: translateY(-100%); opacity: 0; }
        to   { transform: translateY(0);    opacity: 1; }
      }
      .update-banner-icon { font-size: 18px; flex-shrink: 0; }
      .update-banner-text { flex: 1; min-width: 0; }

      /* Notifications enable banner */
      .notif-enable-banner {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 1000;
        padding: 12px 16px;
        background: linear-gradient(135deg, var(--grad-1), var(--grad-2));
        box-shadow: 0 4px 20px rgba(124,92,255,0.4);
        animation: slideDown 0.35s ease;
      }
      .notif-enable-inner {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 620px;
        margin: 0 auto;
      }
      .notif-enable-icon {
        font-size: 24px;
        color: white;
        flex-shrink: 0;
      }
      .notif-enable-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .notif-enable-text strong {
        font-size: 14px;
        color: white;
      }
      .notif-enable-text span {
        font-size: 12px;
        color: rgba(255,255,255,0.8);
      }
      .notif-enable-banner .icon-btn {
        color: white;
        flex-shrink: 0;
      }
      .notif-enable-banner .btn {
        background: white;
        color: var(--grad-1);
        font-weight: 700;
        flex-shrink: 0;
      }

      /* Always-visible install button */
      .install-app-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--primary) !important;
        color: var(--primary) !important;
        font-weight: 600;
        margin-top: 10px;
      }
      .install-app-btn:hover {
        background: rgba(124, 92, 255, 0.08) !important;
      }
      .install-app-btn i { font-size: 18px; }

      /* iOS install modal */
      .ios-install-card { text-align: center; padding: 24px; }
      .ios-app-icon {
        width: 80px; height: 80px;
        border-radius: 20px;
        margin: 0 auto 16px;
        box-shadow: 0 8px 24px rgba(124,92,255,0.35);
      }
      .ios-install-intro { color: var(--text-dim); margin: 0 0 16px; font-size: 15px; }
      .ios-steps {
        text-align: left; padding-left: 0; list-style: none;
        display: flex; flex-direction: column; gap: 14px; margin: 0 0 16px;
      }
      .ios-steps li {
        display: flex; align-items: center; gap: 12px;
        font-size: 14px; color: var(--text-dim);
      }
      .ios-steps li i { font-size: 22px; color: var(--primary); flex-shrink: 0; }
      .ios-install-tip {
        background: var(--bg-elev-2); border: 1px solid var(--line);
        border-radius: 10px; padding: 10px 12px; font-size: 13px;
        color: var(--text-mute); display: flex; align-items: center;
        gap: 8px; text-align: left;
      }
      .ios-install-tip i { color: var(--warn); font-size: 16px; flex-shrink: 0; }

      /* ═══════════════════════════════════════════════════════════ */
      /* SIDEBAR NAV — override original style.css + animations      */
      /* ═══════════════════════════════════════════════════════════ */

      .sidebar { min-width: 220px !important; width: 220px !important; }

      .dl-nav { display: flex !important; flex-direction: column !important; gap: 2px !important; width: 100% !important; }

      .nav.dl-nav .nav-item,
      .dl-nav-item {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        justify-content: flex-start !important;
        gap: 10px !important;
        padding: 9px 10px !important;
        border-radius: 12px !important;
        width: 100% !important;
        min-height: unset !important;
        height: auto !important;
        text-align: left !important;
        background: transparent !important;
        border: none !important;
        cursor: pointer !important;
        position: relative !important;
        overflow: hidden !important;
        transition: background 0.2s ease, transform 0.18s ease !important;
        box-sizing: border-box !important;
      }

      .dl-nav-item i { display: none !important; }

      .dl-nav-item::before {
        content: "" !important;
        position: absolute !important;
        inset: 0 !important;
        background: linear-gradient(135deg, rgba(124,92,252,0.09), rgba(180,92,244,0.04)) !important;
        opacity: 0 !important;
        transition: opacity 0.2s ease !important;
        border-radius: 12px !important;
      }
      .dl-nav-item:hover::before { opacity: 1 !important; }
      .dl-nav-item:hover { transform: translateX(4px) !important; }
      .dl-nav-item:hover .dl-nav-icon i {
        transform: scale(1.2) rotate(-8deg) !important;
        color: var(--primary, #7c5cfc) !important;
      }
      .dl-nav-item.active {
        background: linear-gradient(135deg, rgba(124,92,252,0.14), rgba(180,92,244,0.07)) !important;
      }
      .dl-nav-item.active::after {
        content: "" !important;
        position: absolute !important;
        left: 0 !important; top: 18% !important; bottom: 18% !important;
        width: 3px !important;
        border-radius: 0 3px 3px 0 !important;
        background: linear-gradient(180deg, #7c5cfc, #b45cf4) !important;
      }
      .dl-nav-item.active .dl-nav-icon i {
        color: var(--primary, #7c5cfc) !important;
        filter: drop-shadow(0 0 6px rgba(124,92,252,0.5)) !important;
      }
      .dl-nav-item.active .dl-nav-label {
        color: var(--primary, #7c5cfc) !important;
        font-weight: 700 !important;
      }
      .dl-nav-item:active { transform: translateX(1px) scale(0.98) !important; }

      /* Icon box */
      .dl-nav-icon {
        width: 34px !important; height: 34px !important;
        min-width: 34px !important;
        border-radius: 10px !important;
        background: rgba(255,255,255,0.05) !important;
        display: flex !important; align-items: center !important; justify-content: center !important;
        flex-shrink: 0 !important;
        transition: background 0.2s ease !important;
      }
      .dl-nav-item:hover .dl-nav-icon { background: rgba(124,92,252,0.14) !important; }
      .dl-nav-icon i {
        display: flex !important;
        font-size: 17px !important;
        color: var(--text-mute, #94a3b8) !important;
        transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), color 0.2s ease, filter 0.2s ease !important;
      }

      /* Text stack */
      .dl-nav-text {
        display: flex !important;
        flex-direction: column !important;
        gap: 1px !important;
        min-width: 0 !important;
        flex: 1 !important;
        overflow: hidden !important;
      }
      .dl-nav-label {
        display: block !important;
        font-size: 13px !important;
        font-weight: 600 !important;
        color: var(--text, #e2e8f0) !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        transition: color 0.2s ease !important;
        line-height: 1.4 !important;
      }
      .dl-nav-desc {
        display: block !important;
        font-size: 10.5px !important;
        color: var(--text-mute, #64748b) !important;
        font-weight: 400 !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        line-height: 1.3 !important;
        transition: color 0.2s ease !important;
      }
      .dl-nav-item:hover .dl-nav-desc { color: var(--text-dim, #94a3b8) !important; }

      /* Staggered slide-in entrance */
      @keyframes navIn {
        from { opacity: 0; transform: translateX(-12px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .dl-nav-item { animation: navIn 0.32s ease both !important; }
      .dl-nav-item:nth-child(1)  { animation-delay: 0.04s !important; }
      .dl-nav-item:nth-child(2)  { animation-delay: 0.08s !important; }
      .dl-nav-item:nth-child(3)  { animation-delay: 0.12s !important; }
      .dl-nav-item:nth-child(4)  { animation-delay: 0.16s !important; }
      .dl-nav-item:nth-child(5)  { animation-delay: 0.20s !important; }
      .dl-nav-item:nth-child(6)  { animation-delay: 0.24s !important; }
      .dl-nav-item:nth-child(7)  { animation-delay: 0.28s !important; }
      .dl-nav-item:nth-child(8)  { animation-delay: 0.32s !important; }
      .dl-nav-item:nth-child(9)  { animation-delay: 0.36s !important; }
      .dl-nav-item:nth-child(10) { animation-delay: 0.40s !important; }
    </style>
  </body>
</html>
